[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "evalforge"
version = "0.1.0"
description = "A multi-agent evaluation harness for LLM pipelines."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "evalforge contributors" }]
keywords = ["llm", "evaluation", "eval", "agents", "pipeline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "anyio>=4.4",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "structlog>=24.1",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-randomly>=3.15",
    "anyio>=4.4",
    "trio>=0.26",
    "mypy>=1.10",
    "ruff>=0.5",
    "import-linter>=2.0",
    "pre-commit>=3.7",
    "httpx>=0.27",
]

[project.scripts]
evalforge = "evalforge.cli:app"

[project.urls]
Homepage = "https://github.com/whyujjwal/evalforge"
Source = "https://github.com/whyujjwal/evalforge"

[tool.hatch.build.targets.wheel]
packages = ["evalforge"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["evalforge", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "TID", "RUF"]
ignore = [
    "E501",  # handled by formatter
    "B008",  # allow function calls in defaults (typer)
    "UP007", # keep Optional[...] where it's clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["A002", "N802", "N803", "N806"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = false
plugins = ["pydantic.mypy"]
exclude = ["^tests/fixtures/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["sse_starlette.*", "sqlalchemy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-p", "no:cacheprovider",
]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: integration tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pydantic.*",
]

[tool.coverage.run]
branch = true
source = ["evalforge"]
omit = [
    "evalforge/cli.py",
    "evalforge/server.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.importlinter]
root_package = "evalforge"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "evalforge.cli | evalforge.server",
    "evalforge.engine",
    "evalforge.storage",
    "evalforge.pipeline",
    "evalforge.agents",
    "evalforge.providers",
    "evalforge.events",
    "evalforge.types | evalforge.errors",
]
exhaustive = false

[[tool.importlinter.contracts]]
name = "types and errors are leaves"
type = "forbidden"
source_modules = ["evalforge.types", "evalforge.errors"]
forbidden_modules = [
    "evalforge.events",
    "evalforge.providers",
    "evalforge.agents",
    "evalforge.pipeline",
    "evalforge.storage",
    "evalforge.engine",
    "evalforge.cli",
    "evalforge.server",
    "httpx",
    "sqlalchemy",
    "fastapi",
    "typer",
]
