name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint-types-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      EVALFORGE_TEST_STRICT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.x"
      - name: Set up Python
        env:
          PY_VERSION: ${{ matrix.python-version }}
        run: uv python install "$PY_VERSION"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: ruff check
        run: uv run ruff check evalforge tests
      - name: ruff format --check
        run: uv run ruff format --check evalforge tests
      - name: mypy --strict
        run: uv run mypy evalforge
      - name: import-linter
        run: uv run lint-imports
      - name: pytest with coverage
        run: uv run pytest --cov=evalforge --cov-report=term-missing --cov-report=xml
      - name: coverage floor on core
        run: uv run python scripts/check_core_coverage.py
